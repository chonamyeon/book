<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="manifest" href="/manifest.json" />
  <title>The Archiview - Luxury Digital Library</title>

  <!-- iOS & PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">

  <!-- DNS Prefetch & Preconnect: 외부 리소스 연결 선행 처리 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://accounts.google.com">

  <!-- LCP 최적화: 히어로 이미지 조기 다운로드 (Largest Contentful Paint) -->
  <link rel="preload" as="image" href="/images/hero_expert_v5.png" fetchpriority="high">

  <!-- Pretendard (한글 본문 폰트) -->
  <link rel="stylesheet" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />

  <!-- Material Symbols (아이콘) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />

  <!-- 디스플레이 폰트 (영문 + Alex Brush) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Manrope:wght@200..800&family=Montserrat:wght@700;800;900&display=swap" />

</head>

<body class="bg-white text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden">
  <div id="root"></div>
  <!-- Google Sign-In SDK - defer로 렌더링 블로킹 방지 -->
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script type="module" src="/src/main.jsx?v=3"></script>
</body>

</html>
