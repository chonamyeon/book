<!doctype html>
<html lang="ko" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <!-- viewport-fit=cover: iOS 노치/홈 인디케이터 safe area 활성화 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.json" />
  <title>The Archiview - Luxury Digital Library</title>

  <!-- SEO -->
  <meta name="description" content="프리미엄 디지털 도서관 - 독서 성향 분석, 맞춤 도서 추천, 팟캐스트 요약 서비스">

  <!-- iOS & PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Archiview">
  <meta name="theme-color" content="#090b10">
  <!-- 모바일 포맷 감지 비활성화 (전화번호 파란 링크 방지) -->
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">

  <!-- DNS Prefetch & Preconnect: 외부 리소스 연결 선행 처리 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://accounts.google.com">
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">

  <!-- LCP 최적화: 히어로 이미지 조기 다운로드 (Largest Contentful Paint) -->
  <link rel="preload" as="image" href="/images/hero_expert_v5.png" fetchpriority="high">

  <!-- Pretendard (한글 본문 폰트) - display=swap으로 FOIT 방지 -->
  <link rel="stylesheet" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />

  <!-- Material Symbols (아이콘) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />

  <!-- 디스플레이 폰트 (영문) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@700;800;900&display=swap" />

</head>

<body class="text-slate-100 antialiased overflow-x-hidden" style="background:#090b10;margin:0;padding:0;">
  <div id="root"></div>
  <!-- Google Sign-In SDK - defer로 렌더링 블로킹 방지 -->
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <!-- Kakao SDK (공유 기능) -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous" defer></script>
  <script type="module" src="/src/main.jsx?v=4"></script>
</body>

</html>
